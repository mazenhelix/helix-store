<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAQ | Helix Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hx.css">
<style>.fqh{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin:34px 0 14px}.fqh h1{font-size:clamp(30px,5vw,46px)}
.fqt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 18px}.fqt input[type=search]{max-width:280px}
.chp{background:var(--panel);border:1px solid var(--line);color:var(--mu);border-radius:99px;padding:6px 14px;font:700 13px var(--ui);cursor:pointer}.chp[aria-pressed=true]{color:#06070c;background:linear-gradient(135deg,var(--cy),var(--vi));border-color:transparent}
details.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:0 16px}details.q summary{cursor:pointer;padding:14px 0;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:12px}details.q summary::after{content:"+";color:var(--cy)}details.q[open] summary::after{content:"−"}
details.q .ans{padding:0 0 14px;color:var(--mu)}details.q .ans p{margin:0 0 8px}.adm{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.fqs{max-width:820px}.help{margin:26px 0 50px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
dialog{background:#0d0f17;color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(520px,92vw)}dialog::backdrop{background:rgba(0,0,0,.6)}</style></head><body>
<script src="/shell.js" data-section="faq"></script>
<main class="wrap fqs" id="app"></main>
<dialog id="dlg"></dialog>
<script src="/faq-seed.js"></script>
<script>
const SEED=window.HX_FAQ_SEED;
window.HX_FAQ=SEED.items;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA=JSON.parse(JSON.stringify(SEED)),OWNER=false,EDIT=false,Q='',CAT='All',DB=null,LIVE=false;
const $=id=>document.getElementById(id),uid=()=>'q'+Math.random().toString(36).slice(2,8);
const save=async()=>{try{await DB.doc('faq/main').set(DATA)}catch(e){alert('Could not save: '+(e.detail||e.code||e.message))}};
function view(){const cats=['All',...DATA.cats],list=DATA.items.filter(f=>(CAT==='All'||f.cat===CAT)&&(f.q+' '+f.a).toLowerCase().includes(Q));
 $('app').innerHTML=`<div class="fqh"><div><h1>FAQ</h1><p class="mu">Answers about templates, installing and custom work.</p></div>${OWNER?`<button class="btn sm ${EDIT?'':'g'}" id="tg">${EDIT?'Done editing':'Edit FAQ'}</button>`:''}</div>
 <div class="fqt"><input id="sq" type="search" placeholder="Search questions" aria-label="Search the FAQ" value="${esc(Q)}">${cats.map(c=>`<button class="chp" data-c="${esc(c)}" aria-pressed="${c===CAT}">${esc(c)}</button>`).join('')}${EDIT?'<button class="btn g sm" id="ac">+ Category</button>':''}</div>
 ${EDIT?'<p><button class="btn sm" id="aq">+ Add question</button></p>':''}
 ${list.map((f,i)=>`<details class="q" id="${esc(f.id)}"><summary>${esc(f.q)}</summary><div class="ans">${String(f.a||'').split(/\n+/).map(t=>`<p>${esc(t)}</p>`).join('')}<small class="mu">${esc(f.cat||'')}</small>${EDIT?`<div class="adm"><button class="btn g sm" data-e="${esc(f.id)}">Edit</button><button class="btn g sm" data-u="${esc(f.id)}">Up</button><button class="btn g sm" data-d="${esc(f.id)}">Down</button><button class="btn g sm" data-x="${esc(f.id)}">Delete</button></div>`:''}</div></details>`).join('')||'<p class="mu">No questions match.</p>'}
 <div class="help"><b>Still stuck?</b> <span class="mu">Support and custom requests live in the</span> <a href="/commission/#support" style="color:var(--cy)">Commission section</a>.</div>`;
 const h=location.hash.slice(1),t=h&&$(h);if(t){t.open=true}}
const edit=(f,isNew)=>{const d=$('dlg');d.innerHTML=`<h3>${isNew?'Add':'Edit'} question</h3><label>Question<input id="eq" value="${esc(f.q)}"></label><label>Category<select id="ec">${DATA.cats.map(c=>`<option ${c===f.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Answer (blank line = new paragraph)<textarea id="ea" style="min-height:120px">${esc(f.a)}</textarea></label><p><button class="btn" id="es">Save</button> <button class="btn g" id="ex">Cancel</button></p>`;d.showModal();
 $('ex').onclick=()=>d.close();$('es').onclick=async()=>{f.q=$('eq').value.trim()||'Untitled question';f.cat=$('ec').value;f.a=$('ea').value.trim();if(isNew)DATA.items.push(f);d.close();await save();view()}};
document.addEventListener('input',e=>{if(e.target.id==='sq'){Q=e.target.value.toLowerCase();view();const i=$('sq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const g=k=>b.dataset[k],it=id=>DATA.items.find(x=>x.id===id);
 if(g('c')){CAT=g('c');return view()}if(b.id==='tg'){EDIT=!EDIT;return view()}
 if(b.id==='aq')return edit({id:uid(),q:'',a:'',cat:DATA.cats[0]||''},true);
 if(b.id==='ac'){const n=prompt('New category name');if(n&&!DATA.cats.includes(n.trim())){DATA.cats.push(n.trim());await save();view()}return}
 if(g('e'))return edit(it(g('e')));
 if(g('x')){if(!confirm('Delete this question?'))return;DATA.items=DATA.items.filter(x=>x.id!==g('x'));await save();return view()}
 if(g('u')||g('d')){const id=g('u')||g('d'),i=DATA.items.findIndex(x=>x.id===id),j=i+(g('u')?-1:1);if(j<0||j>=DATA.items.length)return;[DATA.items[i],DATA.items[j]]=[DATA.items[j],DATA.items[i]];await save();view()}});
addEventListener('hashchange',view);
view();
Helix.ready.then(async()=>{OWNER=Helix.isOwner();DB=await claude.use('db');DB.collection('faq').onSnapshot(s=>{const m=s.docs.find(d=>d.id==='main');if(m){DATA=m.data();window.HX_FAQ=DATA.items}if(!(EDIT&&document.activeElement&&document.activeElement.id))view()});view()});
</script></body></html>
