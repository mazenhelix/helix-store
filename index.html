async function homeData(){const t=localStorage.getItem("helix_tok");let d={};try{const r=await fetch("/api/sync",{headers:t?{authorization:"Bearer "+t}:{}});if(r.ok)d=(await r.json()).data||{}}catch(_){}return d}
const HSEC={
 hero(sec,D,M){const pick=featuredPick({count:3},M).filter(p=>p.images[0]).map(p=>({p:{img:p.images[0]}}));

  ${pick.length?`<div class="hv" aria-hidden="true">${pick.map((x,i)=>`<img src="${esc(x.p.img)}" alt="" style="--i:${i}">`).join("")}</div>`:""}</section></div>`},
 cards(sec){return `<section class="blk"><div class="wrap">${sec.title?`<div class="hd"><h2>${esc(sec.title)}</h2></div>`:""}<div class="pillars">${(sec.items||[]).map((it,i)=>{const cls={store:"store",showcase:"show",faq:"fqa",commission:"comm"}[it.k],col={store:"var(--cy)",showcase:"var(--vi)",faq:"#facc15",commission:"#f472b6"}[it.k];
   return `<a class="pil ${cls}" href="${HLINKS[it.k]}" style="--a:${col}"><span class="num">0${i+1}</span><h2>${esc(it.t||it.k)}</h2><p>${esc(it.d)}</p><span class="go2">${HLABEL[it.k]} →</span></a>`}).join("")}</div></div></section>`},
 featured(sec,D,M){const l=featuredPick(sec,M);if(!l.length)return "";
  return `<section class="blk"><div class="wrap"><div class="hd"><h2>${esc(sec.title||"Featured")}</h2><a class="more" href="/store">View the Store →</a></div>${sec.text?`<p class="mu">${esc(sec.text)}</p>`:""}<div class="pgrid">${l.map(p=>HXS.card(p,M.cats)).join("")}</div></div></section>`},
 showcase(sec,D){const ws=Object.values(D.works||{}).flatMap(d=>d.items||[]).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,sec.count||3);if(!ws.length)return "";
  return `<section class="blk"><div class="wrap"><div class="hd"><h2>${esc(sec.title||"Showcase")}</h2><a class="more" href="/showcase/#thumbnails">Open the Showcase →</a></div>${sec.text?`<p class="mu">${esc(sec.text)}</p>`:""}<div class="wkg">${ws.map(w=>`<a class="wk" href="/showcase/#${w.cat==="thumbnails"?"thumbnails":"montage"}" style="--h:${+w.h||200}"><span class="wt">${esc(w.t)}</span><small>${w.cat==="thumbnails"?"Thumbnail":"Montage"}${w.d?" · "+esc(w.d):""}</small></a>`).join("")}</div></div></section>`},
 commission(sec,D){const st=(D.settings&&D.settings.main)||{},open=st.open??true;
  return `<section class="blk"><div class="wrap"><div class="promo"><div><h2>${esc(sec.title)}</h2><p class="mu">${esc(sec.text)}</p>${D.settings?`<p><span class="chip${open?"":" s"}">${open?"● Commissions open"+(st.slots?" · "+st.slots+" slots left":""):"● Commissions closed"}</span></p>`:""}</div><a class="btn" href="/commission/#request">${esc(sec.label||"Request a commission")}</a></div></div></section>`},
 faq(sec,D){const f=(D.faq&&D.faq.main)||window.HX_FAQ_SEED,l=(f.items||[]).slice(0,sec.count||4);if(!l.length)return "";
  return `<section class="blk"><div class="wrap"><div class="hd"><h2>${esc(sec.title||"FAQ")}</h2><a class="more" href="/faq/">All questions →</a></div><div class="faqp">${l.map(q=>`<details class="fq"><summary>${esc(q.q)}</summary><div class="ans">${String(q.a||"").split(/\n+/).map(t=>`<p>${esc(t)}</p>`).join("")}</div></details>`).join("")}</div></div></section>`},
 creators(sec){if(!S.creators.length&&!OWNER)return "";
  return `<section class="blk"><div class="wrap"><div class="hd"><h2>${esc(sec.title||"Creators")}</h2>${OWNER?'<button class="ib" id="addc">+ Add creator</button>':""}</div>${S.creators.length?`<div class="crow">${S.creators.map(c=>`<div class="cw"><a class="cc" href="${esc(c.url||"#")}" target="_blank" rel="noopener"><span class="av">${c.avatar?`<img src="${esc(src(c.avatar))}" alt="">`:esc((c.name||"?")[0])}</span><span><b>${esc(c.name)}</b><small>${esc(c.subs)} subscribers</small></span></a>${OWNER?`<div class="adm"><button class="ib" data-ec="${c.id}">Edit</button></div>`:""}</div>`).join("")}</div>`:'<p class="mu">No creators yet.</p>'}</div></section>`}};
async function home(){const my=++HT;app.innerHTML='<div class="wrap"><p class="mu" style="padding:60px 0">Loading…</p></div>';
 const [D,M]=await Promise.all([homeData(),HXS.load()]);if(my!==HT)return;
 const prev=new URLSearchParams(location.search).get("preview")==="1",H=D.home||{};
 const cfg=(prev&&H.draft)||H.published||window.HX_HOME_DEFAULT;
 app.innerHTML=(prev?`<div class="pvb">${H.draft?"Previewing your unpublished draft. Visitors still see the published page.":"No saved draft yet, showing the live page."} <a href="/admin/#home">Back to editor</a></div>`:"")+cfg.sections.filter(x=>x.on&&HSEC[x.type]).map(x=>HSEC[x.type](x,D,M)).join("");
 $("#addc")?.addEventListener("click",()=>editCreator({id:uid(),name:"",subs:"",url:"",avatar:""},true));
 app.querySelectorAll("[data-ec]").forEach(b=>b.onclick=()=>editCreator(S.creators.find(c=>c.id===b.dataset.ec)))}

/* routing */
function initFaq(){}
function route(){if(!S)return;const h=location.hash.replace(/^#\/?/,""),[a,b]=h.split("/");
 if(a==="faq")return location.replace("/faq/");if(a==="commission")return location.replace("/commission/#request");
 if(a==="store")return location.replace("/store"+(b?"/"+b:""));
 home();footer(null);
 window.Helix&&Helix.setSection("home","");
 scrollTo(0,0);
 if(a==="admin")admin()}
addEventListener("hashchange",route);
document.addEventListener("click",e=>{const a=e.target.closest("[data-s]");if(a){e.preventDefault();document.getElementById(a.dataset.s)?.scrollIntoView({behavior:"smooth"})}});
document.querySelectorAll("dialog").forEach(d=>{d.addEventListener("click",e=>{if(e.target===d)d.close()});d.addEventListener("close",()=>{d.innerHTML=""})});

/* announcement bar */
let annT;
function ann(){clearInterval(annT);const B=S.banner;const on=sale();window.Helix&&Helix.setBanner(on?B:null);
 if(on){const ms=Date.parse(B.endsAt)-Date.now();if(ms>0&&ms<2147e6)annT=setTimeout(()=>{window.Helix&&Helix.setBanner(null);route()},ms+300)}}

 /* ===================== OWNER MODE (only visible to the page owner) ===================== */
const readImg=(file,max)=>new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/webp",.85))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)});
const loc=iso=>{const d=new Date(iso);if(isNaN(d))return"";d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
/* fields: {k,l,t:text|number|area|check|img|dt|tags, full} ; v: object edited in place on save */
function form(title,fields,v,save,del){
 const d=$("#ed"),tmp={};
 d.innerHTML=`<form><h2 class="full">${esc(title)}</h2>${fields.map(f=>{const val=v[f.k];let i;
  if(f.t==="check")return `<div class="fd ${f.full===false?"":"full"}"><label class="ck"><input type="checkbox" name="${f.k}" ${val?"checked":""}>${esc(f.l)}</label></div>`;
  if(f.t==="area")i=`<textarea name="${f.k}">${esc(val)}</textarea>`;
  else if(f.t==="img")i=`<input type="file" name="${f.k}" accept="image/*">${val?`<img class="pvw" src="${esc(src(val))}" alt="">`:""}${val?`<label class="ck"><input type="checkbox" name="${f.k}_rm">Remove current image</label>`:""}`;
  else if(f.t==="dt")i=`<input type="datetime-local" name="${f.k}" value="${loc(val)}">`;
  else if(f.t==="tags")i=`<input name="${f.k}" value="${esc((val||[]).join(", "))}" placeholder="Arenas, Maps">`;
  else i=`<input name="${f.k}" type="${f.t==="number"?"number":"text"}" ${f.t==="number"?'step="any" min="0"':""} value="${esc(val)}">`;
  return `<div class="fd ${f.full===false?"":"full"}"><label>${esc(f.l)}</label>${i}</div>`}).join("")}
 <div class="row"><span>${del?'<button type="button" class="btn dng sm" id="edl">Delete</button>':""}</span><span style="display:flex;gap:8px"><button type="button" class="btn ghost sm" id="ecx">Cancel</button><button class="btn sm" type="submit">Save</button></span></div></form>`;
 const F=d.querySelector("form");
 F.querySelectorAll('input[type=file]').forEach(i=>i.addEventListener("change",async()=>{if(i.files[0]){try{tmp[i.name]=await readImg(i.files[0],i.name==="avatar"?160:720)}catch(_){alert("That file couldn't be read as an image.")}}}));
 $("#ecx").onclick=()=>d.close();
 if(del){const b=$("#edl");b.onclick=()=>{if(b.dataset.s){del();d.close();touch()}else{b.dataset.s=1;b.textContent="Click again to delete"}}}
 F.onsubmit=e=>{e.preventDefault();const fd=new FormData(F);
  fields.forEach(f=>{const raw=fd.get(f.k);
   if(f.t==="check")v[f.k]=F.elements[f.k].checked?1:0;
   else if(f.t==="number")v[f.k]=Math.max(0,parseFloat(raw)||0);
   else if(f.t==="tags")v[f.k]=String(raw).split(",").map(x=>x.trim()).filter(Boolean);
   else if(f.t==="dt")v[f.k]=raw?new Date(raw).toISOString():v[f.k];
   else if(f.t==="img"){if(tmp[f.k]){const pth="images/"+slug(String(v.id||v.name||v.n||"img"))+"-"+uid()+".webp";PEND[pth]=tmp[f.k];v[f.k]=pth}else if(F.elements[f.k+"_rm"]?.checked)v[f.k]=""}
   else v[f.k]=String(raw).trim()});
  save(v);d.close();touch()};
 d.showModal()}
function touch(){dirty++;ownBar();ann();route()}
function editCreator(c,isNew){if(!c)return;form(isNew?"Add creator":"Edit creator",[{k:"name",l:"Creator name"},{k:"subs",l:"Subscribers (e.g. 120K)"},{k:"url",l:"Channel link"},{k:"avatar",l:"Avatar",t:"img"}],c,v=>{if(isNew)S.creators.push(v)},isNew?null:()=>{S.creators=S.creators.filter(x=>x.id!==c.id)})}
function settings(){const o={...S.banner,confirmed:!!S.banner.confirmed,discordUrl:S.discordUrl,email:S.email,formEndpoint:S.formEndpoint};
 form("Site settings",[{k:"enabled",l:"Show announcement bar",t:"check"},{k:"confirmed",l:"I created this code in Payhip and it works at checkout",t:"check"},{k:"badge",l:"Badge text",full:false},{k:"code",l:"Coupon code",full:false},{k:"text",l:"Announcement text"},{k:"pct",l:"Discount shown on prices (%)",t:"number",full:false},{k:"endsAt",l:"Offer ends",t:"dt",full:false},{k:"discordUrl",l:"Discord invite link (leave empty to hide)"},{k:"email",l:"Contact email",full:false},{k:"formEndpoint",l:"Commission form endpoint (Formspree)",full:false}],o,v=>{
  S.banner={enabled:!!v.enabled,confirmed:!!v.confirmed,badge:v.badge,text:v.text,code:v.code,pct:Math.min(90,v.pct),endsAt:v.endsAt};S.discordUrl=v.discordUrl;S.email=v.email;S.formEndpoint=v.formEndpoint})}
/* ===================== OWNER MODE: /#/admin, saves to GitHub ===================== */
const KEY="helix_gh";let VIA=null;
const GT=()=>{try{return localStorage.getItem("helix_tok")}catch(_){return null}};
async function tryG(keep){const t=GT();if(!t)return false;try{const h={authorization:"Bearer "+t},me=await fetch("/api/me",{headers:h});if(!me.ok||!(await me.json()).owner)return false;
 const r=await fetch("/api/site",{headers:h});if(!r.ok)return false;S=JSON.parse((await r.json()).json);initFaq();VIA="api";OWNER=true;dirty=0;note="";if(!keep)history.replaceState(null,"","#/");ann();ownBar();route();return true}catch(_){return false}}
async function gsign(){const el=$("#gb");if(!el||!S.googleClientId)return;await new Promise(r=>{if(window.google)return r();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=r;s.onerror=r;document.head.append(s)});if(!window.google)return;
 google.accounts.id.initialize({client_id:S.googleClientId,callback:async x=>{try{const r=await fetch("/api/auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({credential:x.credential})});if(!r.ok)throw 0;const j=await r.json();localStorage.setItem("helix_tok",j.token);
  if(!j.user.owner){$("#lm").textContent="That Google account is not the owner.";return}$("#ed").close();await tryG()}catch(_){$("#lm").textContent="Google sign-in failed."}}});
 google.accounts.id.renderButton(el,{theme:"filled_black",size:"large",text:"signin_with"})}
const creds=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(_){return null}};
const setCreds=c=>{try{c?localStorage.setItem(KEY,JSON.stringify(c)):localStorage.removeItem(KEY)}catch(_){}};
async function gh(path,opt={}){const c=creds();
 const r=await fetch("https://api.github.com/repos/"+c.repo+path,{...opt,headers:{Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",Authorization:"Bearer "+c.token,...(opt.headers||{})}});
 if(!r.ok){const e=new Error("GitHub "+r.status);e.status=r.status;try{e.detail=(await r.json()).message}catch(_){}throw e}
 return r}
const post=(path,body,method="POST")=>gh(path,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());
function ghError(e){const s=e&&e.status;
 if(s===401)return"GitHub rejected the token. It may be wrong or expired.";
 if(s===403||s===404)return"GitHub can't find that repo, branch or site.json, or the token can't write to it. The token needs Contents: Read and write on this repository.";
 if(s===422)return"The repo changed since you signed in. Reload the page, sign in again and redo your last edit.";
 if(e&&e.message==="Failed to fetch")return"Couldn't reach GitHub. Check your connection.";
 return"Something went wrong"+(e&&e.detail?": "+e.detail:".")}
function login(msg){const d=$("#ed"),c=creds()||{};
 d.innerHTML=`<form><h2 class="full">Owner sign in</h2>
 <p class="mu full" style="font-size:.9rem">Paste a GitHub fine-grained token limited to this repository with <b>Contents: Read and write</b>. It stays in this browser and is never part of the site.</p>
 <div class="fd full"><label>Repository (owner/name)</label><input name="repo" value="${esc(c.repo||"mazenhelix/helix-store")}" placeholder="mazenhelix/helix-store" autocomplete="off" required></div>
 <div class="fd full"><label>Branch</label><input name="branch" value="${esc(c.branch||"main")}" autocomplete="off" required></div>
 <div class="fd full"><label>Token</label><input name="token" type="password" value="${esc(c.token)}" autocomplete="off" required></div>
 <div class="full" id="gb"></div><p class="mu full" style="font-size:.85rem">Sign in with the owner Google account above. Or use a GitHub token below.</p>
 <div class="cm full" role="status" id="lm" style="color:#fb7185">${esc(msg||"")}</div>
 <div class="row"><span></span><span style="display:flex;gap:8px"><button type="button" class="btn ghost sm" id="ecx">Cancel</button><button class="btn sm" type="submit" id="lg">Sign in</button></span></div></form>`;
 $("#ecx").onclick=()=>d.close();
 gsign();d.onclose=()=>{d.innerHTML="";d.onclose=null;if(!OWNER&&/^#\/admin/.test(location.hash))history.replaceState(null,"","#/")};
 $("#ed form").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),b=$("#lg");
  const c={repo:String(f.get("repo")).trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,""),branch:String(f.get("branch")).trim(),token:String(f.get("token")).trim()};
  b.disabled=true;b.textContent="Signing in…";$("#lm").textContent="";
  try{await enter(c);d.close()}catch(err){b.disabled=false;b.textContent="Sign in";$("#lm").textContent=ghError(err)}};
 if(!d.open)d.showModal()}
async function enter(c){setCreds(c);
 try{const r=await gh("/contents/site.json?ref="+encodeURIComponent(c.branch),{headers:{Accept:"application/vnd.github.raw+json"}});S=await r.json();initFaq()}
 catch(e){setCreds(null);throw e}
 OWNER=true;dirty=0;note="";history.replaceState(null,"","#/");ann();ownBar();route()}
async function admin(){
 if(OWNER){history.replaceState(null,"","#/");route();return}
 if(await tryG())return;if(!creds())return login();
 try{await enter(creds())}catch(e){login(ghError(e))}}

async function publish(){const b=$("#pub");b.disabled=true;b.textContent="Publishing…";const c=creds();
 try{
  const json=JSON.stringify(S,null,2)+"\n",used=new Set(json.match(/images\/[^"\\]+/g)||[]);
  if(VIA==="api"){const imgs={};for(const p of Object.keys(PEND))if(used.has(p))imgs[p]=PEND[p].split(",")[1];
   const r=await fetch("/api/site",{method:"PUT",headers:{"content-type":"application/json",authorization:"Bearer "+GT()},body:JSON.stringify({json,images:imgs})});if(!r.ok)throw new Error("api "+r.status);
   dirty=0;note="Published. The live site updates in about a minute.";ownBar();return}
  const files=[{path:"site.json",blob:{content:json,encoding:"utf-8"}},...Object.keys(PEND).filter(p=>used.has(p)).map(p=>({path:p,blob:{content:PEND[p].split(",")[1],encoding:"base64"}}))];
  const br=encodeURIComponent(c.branch);
  const ref=await(await gh("/git/ref/heads/"+br)).json(),base=ref.object.sha;
  const cm=await(await gh("/git/commits/"+base)).json();
  const tree=[];for(const f of files){const bl=await post("/git/blobs",f.blob);tree.push({path:f.path,mode:"100644",type:"blob",sha:bl.sha})}
  const nt=await post("/git/trees",{base_tree:cm.tree.sha,tree});
  const nc=await post("/git/commits",{message:"Update site content",tree:nt.sha,parents:[base]});
  await post("/git/refs/heads/"+br,{sha:nc.sha},"PATCH");
  dirty=0;note="Published. The live site updates in about a minute.";ownBar()}
 catch(e){ownBar();alert("Publishing failed. "+ghError(e))}}

function ownBar(){let o=$("#own");if(!o){o=document.createElement("div");o.id="own";o.setAttribute("role","region");o.setAttribute("aria-label","Owner tools");document.body.append(o);document.body.style.paddingBottom="90px"}
 o.innerHTML=`<b>Owner mode</b><button class="btn ghost sm" id="set">Site settings</button><span class="mu" style="font-size:.85rem">${dirty?dirty+" unpublished change"+(dirty>1?"s":""):esc(note||"No changes")}</span>${dirty?'<button class="btn sm" id="pub">Publish changes</button><button class="btn ghost sm" id="dis">Discard</button>':""}<button class="btn ghost sm" id="out">Sign out</button>`;
 $("#set").onclick=settings;$("#pub")?.addEventListener("click",publish);$("#dis")?.addEventListener("click",()=>{dirty=0;location.reload()});
 $("#out").onclick=()=>{if(dirty&&!confirm("You have unpublished changes. Sign out and lose them?"))return;dirty=0;setCreds(null);try{localStorage.removeItem("helix_tok")}catch(_){}location.reload()}}
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

/* load content, then render */
(async()=>{
 try{const r=await fetch("site.json",{cache:"no-cache"});if(!r.ok)throw 0;S=await r.json();initFaq()}
 catch(_){app.innerHTML='<div class="wrap"><div class="soon"><h2>The site data didn\'t load</h2><p class="mu">Check your connection and refresh. If you opened this file straight from disk, serve the folder with a local web server instead.</p></div></div>';return}
 ann();route();tryG(1)})();
