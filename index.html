<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helix Studio — animations, builds and plugins for Minecraft creators</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070c;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);--tx:#eef1f8;--mu:#9aa3b8;--cy:#22d3ee;--vi:#8b5cf6;--bl:#3b82f6;--ok:#4ade80;
--px:"Pixelify Sans","Courier New",monospace;--ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(900px 500px at 85% -5%,rgba(139,92,246,.18),transparent 60%),radial-gradient(700px 500px at -5% 20%,rgba(34,211,238,.1),transparent 60%),var(--bg);color:var(--tx);font:500 16px/1.55 var(--ui);min-height:100vh}
a{color:inherit;text-decoration:none}img,video,canvas{max-width:100%}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:4px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-family:var(--px);font-weight:700;line-height:1.08;margin:0}
h1{font-size:clamp(2.2rem,5.4vw,4rem);letter-spacing:-.01em}h2{font-size:clamp(1.5rem,3vw,2.1rem)}h3{font-size:1.25rem}
p{margin:0}.mu{color:var(--mu)}
/* announcement */
#ann{background:linear-gradient(90deg,var(--vi),var(--bl) 55%,var(--cy));color:#04050a;font-weight:700;font-size:.9rem}
#ann .wrap{display:flex;gap:10px 14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 0;position:relative}
#ann .tag{background:#04050a;color:var(--cy);padding:2px 9px;border-radius:99px;font-size:.75rem}
#ann button.code{font:inherit;font-weight:800;background:rgba(255,255,255,.28);border:2px dashed #04050a;border-radius:6px;padding:2px 10px;cursor:pointer;color:inherit}
#ann button.code:hover{background:rgba(255,255,255,.5)}
#ann .x{background:none;border:0;font-size:1.2rem;cursor:pointer;color:inherit;padding:4px 8px}
#cd{font-variant-numeric:tabular-nums}
/* nav */
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(14px);background:rgba(6,7,12,.72);border-bottom:1px solid var(--line)}
header.nav .wrap{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font:700 1.35rem var(--px);margin-right:auto}
.logo i{width:22px;height:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.logo i b{background:var(--cy)}.logo i b:nth-child(2n){background:var(--vi)}.logo i b:nth-child(3),.logo i b:nth-child(6),.logo i b:nth-child(9),.logo i b:nth-child(12){opacity:.35}
nav{display:flex;gap:4px}nav a{padding:8px 12px;border-radius:8px;color:var(--mu);font-size:.95rem;font-weight:700}
nav a:hover,nav a[aria-current=page]{color:var(--tx);background:var(--panel)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:800 .95rem var(--ui);padding:11px 18px;border-radius:10px;color:#05060b;background:linear-gradient(135deg,var(--cy),#7dd3fc);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px -6px var(--cy)}
.btn.ghost{background:var(--panel);color:var(--tx);border:1px solid var(--line)}.btn.ghost:hover{box-shadow:none;border-color:var(--vi)}
.btn.off{background:var(--panel);color:var(--mu);cursor:not-allowed;border:1px solid var(--line)}.btn.off:hover{transform:none;box-shadow:none}
.btn.sm{padding:8px 13px;font-size:.85rem;border-radius:8px}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:56px 0 28px}
.hero p.lead{font-size:1.15rem;color:var(--mu);max-width:48ch;margin:18px 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0 8px}
.metric{padding:16px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.metric b{display:block;font:700 1.9rem var(--px);color:var(--cy)}.metric span{font-size:.85rem;color:var(--mu)}
section.blk{padding:54px 0 6px}.blk>.wrap>.hd{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
/* gateways: stepped pixel corners */
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gate{--a:var(--cy);display:flex;flex-direction:column;gap:10px;padding:26px 24px 22px;min-height:250px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:0;position:relative;
clip-path:polygon(0 12px,6px 12px,6px 6px,12px 6px,12px 0,calc(100% - 12px) 0,calc(100% - 12px) 6px,calc(100% - 6px) 6px,calc(100% - 6px) 12px,100% 12px,100% calc(100% - 12px),calc(100% - 6px) calc(100% - 12px),calc(100% - 6px) calc(100% - 6px),calc(100% - 12px) calc(100% - 6px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 6px),6px calc(100% - 6px),6px calc(100% - 12px),0 calc(100% - 12px));transition:background .2s}
.gate::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--a)}
.gate:hover{background:linear-gradient(160deg,color-mix(in srgb,var(--a) 22%,transparent),rgba(255,255,255,.02))}
.gate .em{font-size:2.4rem;line-height:1}.gate p{color:var(--mu);font-size:.95rem}.gate .go{margin-top:auto;font-weight:800;color:var(--a);display:flex;justify-content:space-between}
.gate:nth-child(2){--a:var(--vi)}.gate:nth-child(3){--a:var(--bl)}
/* creators */
.crow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cc{display:flex;gap:14px;align-items:center;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);transition:border-color .2s}.cc:hover{border-color:var(--cy)}
.av{width:56px;height:56px;border-radius:12px;flex:none;display:grid;place-items:center;font:700 1.3rem var(--px);background:linear-gradient(135deg,var(--vi),var(--cy));color:#05060b;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.cc b{display:block}.cc small{color:var(--mu)}
.chip{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(34,211,238,.12);color:var(--cy);margin-top:4px}
.chip.s{background:rgba(250,204,21,.14);color:#facc15}
/* proof */
.proof{display:grid;grid-template-columns:2fr 1fr;gap:16px}.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.q{padding:20px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.disc{padding:24px;border-radius:14px;background:linear-gradient(150deg,rgba(139,92,246,.3),rgba(59,130,246,.12));border:1px solid rgba(139,92,246,.5);display:flex;flex-direction:column;gap:12px;justify-content:center}
/* commission */
.form{display:grid;gap:10px;grid-template-columns:1fr 1fr;padding:24px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.form .full{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--cy);outline:0;box-shadow:0 0 0 3px rgba(34,211,238,.2)}
textarea{min-height:110px;resize:vertical}select option{background:#0c0e16}
.cm{min-height:1.4em;font-weight:700}
/* store */
.sh{padding:44px 0 10px}.sh p{max-width:60ch;margin-top:10px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.tools input{max-width:280px}.tools select{width:auto}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--mu);font:700 .85rem var(--ui);padding:8px 14px;border-radius:99px;cursor:pointer;min-height:40px}
.pill[aria-pressed=true]{background:var(--cy);color:#05060b;border-color:var(--cy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding-bottom:40px}
.card{position:relative;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--vi);transform:translateY(-3px)}
.thumb{aspect-ratio:16/10;position:relative;background:linear-gradient(135deg,var(--c1,#243),var(--c2,#123));display:grid;place-items:center;overflow:hidden;cursor:pointer;border:0;width:100%;padding:0}
.thumb>*:not(.bd){position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ph{display:grid;place-items:center;font:700 2.4rem var(--px);color:rgba(255,255,255,.55);background:repeating-conic-gradient(rgba(255,255,255,.05) 0 25%,transparent 0 50%) 0 0/28px 28px}
.thumb .pv{position:absolute;right:10px;bottom:10px;inset:auto 10px 10px auto;width:auto;height:auto;background:rgba(0,0,0,.65);padding:4px 10px;border-radius:99px;font-size:.78rem;font-weight:800;opacity:0;transition:opacity .2s}
.card:hover .pv,.thumb:focus-visible .pv{opacity:1}
.bd{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:2}
.bd span{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:6px;background:#05060b;color:var(--cy)}.bd .sale{background:#f43f5e;color:#fff}.bd .best{background:#facc15;color:#05060b}.bd .smp{background:#facc15;color:#05060b}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}.cb h3{font-size:1.05rem}.cb small{color:var(--mu)}
.buy{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px}
.price b{font:700 1.3rem var(--px)}.price s{color:var(--mu);margin-left:6px;font-size:.9rem}
.empty{grid-column:1/-1;text-align:center;padding:50px 0;color:var(--mu)}
.cols .card{border-color:rgba(139,92,246,.4)}
dialog{border:1px solid var(--line);border-radius:18px;background:#0c0e16;color:var(--tx);padding:0;width:min(720px,calc(100% - 24px));max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
dialog .thumb{cursor:default;aspect-ratio:16/9}dialog .bodyd{padding:20px;display:grid;gap:12px}
dialog .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
footer{margin-top:60px;border-top:1px solid var(--line);padding:28px 0 36px;color:var(--mu);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:30px}.hl{min-height:200px;order:-1}.gates,.proof,.form{grid-template-columns:1fr}.gate{min-height:0}nav a:not(.keep){display:none}header.nav .wrap{gap:8px}.tools input{max-width:none;flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.lg{height:34px;width:auto;image-rendering:pixelated;display:block}.logo i{display:none}
.hl{position:relative;display:grid;place-items:center;min-height:340px}
.hl img{width:min(330px,72%);image-rendering:pixelated;filter:drop-shadow(0 0 44px rgba(34,211,238,.35));animation:bob 5s ease-in-out infinite}
.hl i{position:absolute;width:12px;height:12px;background:var(--cy);opacity:.7;animation:bob 4s ease-in-out infinite}
.hl i:nth-of-type(2n){background:var(--vi);animation-duration:6s}
@keyframes bob{50%{transform:translateY(-12px)}}
.soon{display:grid;justify-items:center;gap:12px;text-align:center;padding:56px 20px;margin:24px 0 40px;border-radius:16px;border:1px dashed var(--line);background:var(--panel)}
.soon img{height:84px;image-rendering:pixelated;opacity:.8}
#own{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:50;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(18,20,32,.92);backdrop-filter:blur(14px);border:1px solid var(--vi);box-shadow:0 10px 40px rgba(0,0,0,.6);flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px)}
#own b{font-size:.85rem;color:var(--cy);padding:0 6px}
.adm{position:absolute;right:8px;top:8px;display:flex;gap:6px;z-index:3}
.ib{border:1px solid var(--line);background:rgba(5,6,11,.85);color:var(--tx);font:800 .75rem var(--ui);padding:5px 10px;border-radius:7px;cursor:pointer}.ib:hover{border-color:var(--cy)}
.cw{position:relative}.cw .adm{top:50%;transform:translateY(-50%)}
.fd{display:grid;gap:5px}.fd>label{font-size:.82rem;font-weight:800;color:var(--mu)}.fd label.ck{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:.95rem}.fd input[type=checkbox]{width:auto}
.fd .pvw{max-height:90px;max-width:160px;border-radius:8px;image-rendering:auto}
#ed form{padding:20px;display:grid;gap:12px;grid-template-columns:1fr 1fr}#ed .full{grid-column:1/-1}
#ed .row{grid-column:1/-1;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn.dng{background:#f43f5e;color:#fff}
@media(max-width:600px){#ed form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="ann" hidden><div class="wrap"><span class="tag" id="at"></span><span id="am"></span><button class="code" id="ac" title="Copy code"></button><span>Ends in <b id="cd"></b></span><button class="x" id="ax" aria-label="Dismiss announcement">×</button></div></div>
<header class="nav"><div class="wrap">
<a class="logo" href="#/" aria-label="Helix Studio home"><img class="lg" src="images/logo.webp" alt="">Helix Studio</a>
<nav aria-label="Main"><a href="#/store/animations" data-r="animations">Animations</a><a href="#/store/builds" data-r="builds">Builds</a><a href="#/store/plugins" data-r="plugins">Plugins</a><a class="keep" href="#/commission">Commission</a></nav>
</div></header>
<main id="app"></main>
<footer id="ft"></footer>
<dialog id="dlg" aria-label="Product preview"></dialog>
<dialog id="ed" aria-label="Edit"></dialog>
<script>
/* Capture the clean page source once, before anything renders, so owner edits can be saved back into it. */
let S=null;
let OWNER=false,dirty=0,note="";
const PEND={},src=u=>PEND[u]||u;
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),uid=()=>Math.random().toString(36).slice(2,9);
const money=n=>"$"+(+(+n).toFixed(2)),LOGO=$(".lg").src;
const ap=n=>{n=Math.floor(n);if(n<10)return String(n);const m=10**(String(n).length-1);return Math.floor(n/m)*m+"+"};
const sale=()=>S.banner.enabled&&Date.now()<Date.parse(S.banner.endsAt);
const disc=p=>sale()?+(p*(1-S.banner.pct/100)).toFixed(2):+p;
const priceHtml=p=>`<span class="price"><b>${p>0?money(disc(p)):"Free"}</b>${sale()&&p>0?`<s>${money(p)}</s>`:""}</span>`;
const COL={Text:["#1f6b43","#0f2a3d"],Objects:["#8a5415","#2a1646"],UI:["#1f4f9a","#241a5a"],Scenes:["#8a2f56","#1b1a4a"],builds:["#1f6b43","#0f2a3d"],plugins:["#1f4f9a","#241a5a"]};
const STORES={
 animations:{em:"🎬",t:"3D Animation & Motion Assets",s:"Animations",b:"MOGRTs, lower thirds and renders for Premiere Pro. Hover a card to preview it.",g:"Templates for Premiere Pro, sold singly or as collections."},
 builds:{em:"🗺️",t:"Minecraft Builds & Schematics",s:"Builds",b:"Spawns, arenas and custom maps ready to paste into your world.",g:"Spawns, arenas and custom maps."},
 plugins:{em:"⚙️",t:"Minecraft Plugins & Modules",s:"Plugins",b:"Event engines, systems and Skripts for your server.",g:"Event engines, systems and Skripts."}};
const app=$("#app"),tpls=()=>S.stores.animations.filter(p=>!p.coll);
function stats(p){const g=tpls().filter(x=>(p.cats||[]).includes(x.cat));return{cnt:g.length,tot:g.reduce((a,x)=>a+ +x.price,0)}}
const desc=p=>p.coll&&!p.d?(()=>{const t=stats(p);return `${t.cnt} templates for ${money(p.price)} instead of ${money(t.tot)}.`})():p.d||"";
const buyBtn=(p,c="")=>p.link?`<a class="btn ${c}" href="${esc(p.link)}" target="_blank" rel="noopener">Buy now</a>`:`<span class="btn off ${c}">Coming soon</span>`;
const colors=(p,k)=>k==="animations"?COL[p.tags?.[0]]||COL.Text:COL[k];

function card(p,k){
 const [c1,c2]=colors(p,k),s=slug(p.n);
 const media=p.img?`<img src="${esc(src(p.img))}" alt="${esc(p.n)} cover" loading="lazy">`:`<div class="ph">${esc((p.n||"?").split(/\s+/).slice(0,2).map(w=>w[0]).join(""))}</div>${k==="animations"?`<img src="thumbs/${s}.png" alt="" loading="lazy" onerror="this.remove()"><video src="previews/${s}.mp4" muted loop playsinline preload="none" onerror="this.remove()"></video>`:""}`;
 return `<article class="card"><button class="thumb" style="--c1:${c1};--c2:${c2}" data-pv="${k}|${p.id}" aria-label="Quick preview: ${esc(p.n)}"><span class="bd">${p.new?'<span>New</span>':""}${p.popular?'<span>Popular</span>':""}${p.best?'<span class="best">Best value</span>':""}${sale()?'<span class="sale">On sale</span>':""}</span>${media}<span class="pv">Quick preview</span></button>
 ${OWNER?`<div class="adm"><button class="ib" data-ep="${k}|${p.id}">Edit</button></div>`:""}
 <div class="cb"><h3>${esc(p.n)}</h3><small>${esc((p.tags||[]).join(" · "))}${p.size?" · "+esc(p.size):""}</small>
 <div class="buy">${priceHtml(+p.price)}${buyBtn(p,"sm")}</div></div></article>`}

function home(){
 const A=S.stores.animations,t=tpls(),full=A.find(p=>p.best),m=[];
 if(t.length)m.push({label:"Animation templates",value:ap(t.length)});
 const nc=A.filter(p=>p.coll).length;if(nc)m.push({label:"Collections",value:ap(nc)});
 if(full){const sv=stats(full).tot-full.price;if(sv>0)m.push({label:"Saved with the Full Bundle",value:"$"+ap(sv)})}
 app.innerHTML=`<div class="wrap"><section class="hero"><div><h1>Animations, builds and plugins made for Minecraft creators.</h1>
 <p class="lead">Helix Studio is an independent creator and developer studio. Buy ready-made assets for your videos and server, or commission something built to your brief.</p>
 <div class="cta"><a class="btn" href="#gates" data-s="gates">Browse assets</a><a class="btn ghost" href="#/commission">Request custom commission</a></div></div>
 <div class="hl" aria-hidden="true"><img src="${LOGO}" alt=""><i style="left:12%;top:22%"></i><i style="right:10%;top:14%;animation-delay:-1s"></i><i style="left:6%;bottom:26%;animation-delay:-2s"></i><i style="right:16%;bottom:18%;animation-delay:-3s"></i></div></section>
 ${m.length?`<div class="metrics">${m.map(x=>`<div class="metric"><b>${esc(x.value)}</b><span>${esc(x.label)}</span></div>`).join("")}</div>`:""}</div>
 <section class="blk" id="gates"><div class="wrap"><div class="hd"><h2>Choose a store</h2></div><div class="gates">${Object.entries(STORES).map(([k,s])=>{const n=S.stores[k].filter(p=>!p.coll).length;return `<a class="gate" href="#/store/${k}"><span class="em" aria-hidden="true">${s.em}</span><h3>${s.t}</h3><p>${s.g}</p><span class="go"><span>${n?ap(n)+" templates".replace("templates",k==="animations"?"templates":"listings"):"Coming soon"}</span><span>Open store</span></span></a>`}).join("")}</div></div></section>
 ${S.creators.length||OWNER?`<section class="blk"><div class="wrap"><div class="hd"><h2>Creators using Helix</h2>${OWNER?'<button class="ib" id="addc">+ Add creator</button>':""}</div>${S.creators.length?`<div class="crow">${S.creators.map(c=>`<div class="cw"><a class="cc" href="${esc(c.url||"#")}" target="_blank" rel="noopener"><span class="av">${c.avatar?`<img src="${esc(src(c.avatar))}" alt="">`:esc((c.name||"?")[0])}</span><span><b>${esc(c.name)}</b><small>${esc(c.subs)} subscribers</small><br><span class="chip">Works powered by Helix</span></span></a>${OWNER?`<div class="adm"><button class="ib" data-ec="${c.id}">Edit</button></div>`:""}</div>`).join("")}</div>`:'<p class="mu">No creators yet. Add partners as you sign them.</p>'}</div></section>`:""}
 ${S.discordUrl?`<section class="blk"><div class="wrap"><div class="disc"><h3>Join the community</h3><p>Ask questions, share what you made and hear about new releases first.</p><a class="btn" href="${esc(S.discordUrl)}" target="_blank" rel="noopener">Join our Discord</a></div></div></section>`:""}
 <section class="blk" id="commission"><div class="wrap"><div class="hd"><h2>Request a custom commission</h2><span class="mu">Tell us what you need and we'll reply by email with a quote.</span></div>
 <form class="form" id="cf"><p hidden><input name="_gotcha" tabindex="-1" autocomplete="off"></p>

 <select name="type" aria-label="Project type"><option>Animation</option><option>Minecraft build</option><option>Plugin or Skript</option><option>Something else</option></select><input name="deadline" placeholder="Deadline (optional)" aria-label="Deadline">

 <div class="full" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><button class="btn" id="send" type="submit">Send request</button><div class="cm" id="cm" role="status"></div></div></form></div></section>`;
 $("#cf").addEventListener("submit",submit);
 $("#addc")?.addEventListener("click",()=>editCreator({id:uid(),name:"",subs:"",url:"",avatar:""},true));
 app.querySelectorAll("[data-ec]").forEach(b=>b.onclick=()=>editCreator(S.creators.find(c=>c.id===b.dataset.ec)))}
async function submit(e){e.preventDefault();const f=e.currentTarget,b=$("#send"),m=$("#cm"),fd=new FormData(f);if(fd.get("_gotcha"))return;
 b.disabled=true;b.textContent="Sending…";m.textContent="";
 try{const r=await fetch(S.formEndpoint,{method:"POST",headers:{Accept:"application/json"},body:fd});if(!r.ok)throw 0;f.reset();m.style.color="var(--ok)";m.textContent="Request sent. We'll reply by email with a quote."}
 catch(_){m.style.color="#fb7185";m.textContent="The request didn't send. Check your connection and retry, or email "+S.email+"."}
 b.disabled=false;b.textContent="Send request"}

function store(k){
 const M=STORES[k],all=S.stores[k],tags=["All",...new Set(all.flatMap(p=>p.tags||[]))];let tag="All",q="",sort="featured";
 app.innerHTML=`<div class="wrap"><div class="sh" style="display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap"><div><h1>${M.em} ${M.s}</h1><p class="mu">${M.b}</p></div>${OWNER?'<button class="btn sm" id="addp">+ Add listing</button>':""}</div>
 ${all.length?`<div class="tools"><input id="q" type="search" placeholder="Search ${M.s.toLowerCase()}" aria-label="Search"><select id="so" aria-label="Sort"><option value="featured">Featured</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="az">Name A–Z</option></select><div id="tg" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
 <p class="mu" id="cnt" aria-live="polite"></p><div class="grid" id="gr"></div>`:`<div class="soon"><img src="${LOGO}" alt=""><h2>Coming soon</h2><p class="mu">${M.s} are on the way. Need something now? Commission a custom build.</p><a class="btn" href="#/commission">Request a commission</a></div>`}</div>`;
 $("#addp")?.addEventListener("click",()=>editProduct(k,{id:uid(),n:"",price:0,tags:[],link:"",d:"",img:""},true));
 if(!all.length)return;
 const draw=()=>{
  $("#tg").innerHTML=tags.map(t=>`<button class="pill" aria-pressed="${t===tag}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  let l=all.filter(p=>(tag==="All"||(p.tags||[]).includes(tag))&&p.n.toLowerCase().includes(q));
  if(sort==="lo")l=[...l].sort((a,b)=>a.price-b.price);if(sort==="hi")l=[...l].sort((a,b)=>b.price-a.price);if(sort==="az")l=[...l].sort((a,b)=>a.n.localeCompare(b.n));
  if(sort==="featured")l=[...l].sort((a,b)=>(b.coll?1:0)-(a.coll?1:0));
  $("#cnt").textContent=l.length+" "+(l.length===1?"listing":"listings");
  $("#gr").innerHTML=l.length?l.map(p=>card(p,k)).join(""):`<div class="empty">No listings match "${esc(q)}". Clear the search or pick another filter.</div>`};
 $("#tg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){tag=b.dataset.t;draw()}});
 $("#q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();draw()});$("#so").addEventListener("change",e=>{sort=e.target.value;draw()});
 const g=$("#gr"),pl=(e,go)=>{const v=e.target.closest(".card")?.querySelector("video");if(v)go?v.play().catch(()=>{}):(v.pause(),v.currentTime=0)};
 g.addEventListener("pointerover",e=>pl(e,1));g.addEventListener("pointerout",e=>pl(e,0));g.addEventListener("focusin",e=>pl(e,1));
 g.addEventListener("click",e=>{
  const ed=e.target.closest("[data-ep]");if(ed){const[kk,id]=ed.dataset.ep.split("|");return editProduct(kk,S.stores[kk].find(x=>x.id===id))}
  const b=e.target.closest("[data-pv]");if(!b)return;const[kk,id]=b.dataset.pv.split("|"),p=S.stores[kk].find(x=>x.id===id),[c1,c2]=colors(p,kk),s=slug(p.n);
  $("#dlg").innerHTML=`<div class="thumb" style="--c1:${c1};--c2:${c2}">${p.img?`<img src="${esc(src(p.img))}" alt="${esc(p.n)}">`:`<div class="ph">${esc(p.n[0]||"?")}</div>${kk==="animations"?`<video src="previews/${s}.mp4" autoplay muted loop playsinline onerror="this.remove()"></video>`:""}`}</div>
  <div class="bodyd"><h2>${esc(p.n)}</h2><p class="mu">${esc(desc(p))}</p><p><small class="mu">${esc((p.tags||[]).join(" · "))}${kk==="animations"?" · Works with Adobe Premiere Pro":""}</small></p>
  <div class="row">${priceHtml(+p.price)}<span style="display:flex;gap:8px"><button class="btn ghost" id="xc">Close</button>${buyBtn(p)}</span></div></div>`;
  $("#dlg").showModal();$("#xc").onclick=()=>$("#dlg").close()});
 draw()}

/* footer: the Premiere / affiliation note belongs to the animations store only */
function footer(k){$("#ft").innerHTML=`<div class="wrap"><span>${k==="animations"?"Works with Adobe Premiere Pro (Essential Graphics). Not affiliated with Mojang or Microsoft.":"© Helix Studio"}</span><span><a href="mailto:${esc(S.email)}">Email</a></span></div>`}

/* routing */
function route(){if(!S)return;const h=location.hash.replace(/^#\/?/,""),[a,b]=h.split("/"),k=a==="store"&&STORES[b]?b:null;
 k?store(k):home();footer(k);
 document.querySelectorAll("nav a[data-r]").forEach(l=>l.dataset.r===k?l.setAttribute("aria-current","page"):l.removeAttribute("aria-current"));
 if(a==="commission")setTimeout(()=>$("#commission")?.scrollIntoView({behavior:"smooth"}),50);else scrollTo(0,0);
 if(a==="admin")admin()}
addEventListener("hashchange",route);
document.addEventListener("click",e=>{const a=e.target.closest("[data-s]");if(a){e.preventDefault();document.getElementById(a.dataset.s)?.scrollIntoView({behavior:"smooth"})}});
document.querySelectorAll("dialog").forEach(d=>{d.addEventListener("click",e=>{if(e.target===d)d.close()});d.addEventListener("close",()=>{d.innerHTML=""})});

/* announcement bar */
let annT;
function ann(){clearInterval(annT);const B=S.banner,bar=$("#ann");bar.hidden=!sale();if(!sale())return;
 $("#at").textContent=B.badge;$("#am").textContent=B.text;$("#ac").textContent=B.code;
 const tick=()=>{const end=Date.parse(B.endsAt);if(Date.now()>=end){clearInterval(annT);bar.hidden=true;route();return}
  let s=Math.floor((end-Date.now())/1e3);const d=Math.floor(s/86400);s%=86400;const p=n=>String(n).padStart(2,"0");
  $("#cd").textContent=(d?d+"d ":"")+p(Math.floor(s/3600))+":"+p(Math.floor(s%3600/60))+":"+p(s%60)};
 tick();annT=setInterval(tick,1000);
 $("#ac").onclick=async()=>{try{await navigator.clipboard.writeText(B.code);$("#ac").textContent="Copied"}catch(_){$("#ac").textContent="Select & copy: "+B.code}setTimeout(()=>$("#ac").textContent=B.code,1800)};
 $("#ax").onclick=()=>{bar.hidden=true}}

/* ===================== OWNER MODE (only visible to the page owner) ===================== */
const readImg=(file,max)=>new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/webp",.85))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)});
const loc=iso=>{const d=new Date(iso);if(isNaN(d))return"";d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
/* fields: {k,l,t:text|number|area|check|img|dt|tags, full} ; v: object edited in place on save */
function form(title,fields,v,save,del){
 const d=$("#ed"),tmp={};
 d.innerHTML=`<form><h2 class="full">${esc(title)}</h2>${fields.map(f=>{const val=v[f.k];let i;
  if(f.t==="check")return `<div class="fd ${f.full===false?"":"full"}"><label class="ck"><input type="checkbox" name="${f.k}" ${val?"checked":""}>${esc(f.l)}</label></div>`;
  if(f.t==="area")i=`<textarea name="${f.k}">${esc(val)}</textarea>`;
  else if(f.t==="img")i=`<input type="file" name="${f.k}" accept="image/*">${val?`<img class="pvw" src="${esc(src(val))}" alt="">`:""}${val?`<label class="ck"><input type="checkbox" name="${f.k}_rm">Remove current image</label>`:""}`;
  else if(f.t==="dt")i=`<input type="datetime-local" name="${f.k}" value="${loc(val)}">`;
  else if(f.t==="tags")i=`<input name="${f.k}" value="${esc((val||[]).join(", "))}" placeholder="Arenas, Maps">`;
  else i=`<input name="${f.k}" type="${f.t==="number"?"number":"text"}" ${f.t==="number"?'step="any" min="0"':""} value="${esc(val)}">`;
  return `<div class="fd ${f.full===false?"":"full"}"><label>${esc(f.l)}</label>${i}</div>`}).join("")}
 <div class="row"><span>${del?'<button type="button" class="btn dng sm" id="edl">Delete</button>':""}</span><span style="display:flex;gap:8px"><button type="button" class="btn ghost sm" id="ecx">Cancel</button><button class="btn sm" type="submit">Save</button></span></div></form>`;
 const F=d.querySelector("form");
 F.querySelectorAll('input[type=file]').forEach(i=>i.addEventListener("change",async()=>{if(i.files[0]){try{tmp[i.name]=await readImg(i.files[0],i.name==="avatar"?160:720)}catch(_){alert("That file couldn't be read as an image.")}}}));
 $("#ecx").onclick=()=>d.close();
 if(del){const b=$("#edl");b.onclick=()=>{if(b.dataset.s){del();d.close();touch()}else{b.dataset.s=1;b.textContent="Click again to delete"}}}
 F.onsubmit=e=>{e.preventDefault();const fd=new FormData(F);
  fields.forEach(f=>{const raw=fd.get(f.k);
   if(f.t==="check")v[f.k]=F.elements[f.k].checked?1:0;
   else if(f.t==="number")v[f.k]=Math.max(0,parseFloat(raw)||0);
   else if(f.t==="tags")v[f.k]=String(raw).split(",").map(x=>x.trim()).filter(Boolean);
   else if(f.t==="dt")v[f.k]=raw?new Date(raw).toISOString():v[f.k];
   else if(f.t==="img"){if(tmp[f.k]){const pth="images/"+slug(String(v.id||v.name||v.n||"img"))+"-"+uid()+".webp";PEND[pth]=tmp[f.k];v[f.k]=pth}else if(F.elements[f.k+"_rm"]?.checked)v[f.k]=""}
   else v[f.k]=String(raw).trim()});
  save(v);d.close();touch()};
 d.showModal()}
function touch(){dirty++;ownBar();ann();route()}
const PF=[{k:"n",l:"Name"},{k:"price",l:"Price (USD, 0 = free)",t:"number",full:false},{k:"size",l:"File size (optional)",full:false},{k:"tags",l:"Tags (comma separated)",t:"tags"},{k:"link",l:"Purchase link (Payhip or other URL)"},{k:"d",l:"Description",t:"area"},{k:"img",l:"Thumbnail image",t:"img"},{k:"new",l:"Badge: New",t:"check",full:false},{k:"popular",l:"Badge: Popular",t:"check",full:false},{k:"best",l:"Badge: Best value",t:"check",full:false}];
function editProduct(k,p,isNew){if(!p)return;form(isNew?"Add listing":"Edit listing",PF,p,v=>{if(!v.n)v.n="Untitled";if(isNew)S.stores[k].push(v)},isNew?null:()=>{S.stores[k]=S.stores[k].filter(x=>x.id!==p.id)})}
function editCreator(c,isNew){if(!c)return;form(isNew?"Add creator":"Edit creator",[{k:"name",l:"Creator name"},{k:"subs",l:"Subscribers (e.g. 120K)"},{k:"url",l:"Channel link"},{k:"avatar",l:"Avatar",t:"img"}],c,v=>{if(isNew)S.creators.push(v)},isNew?null:()=>{S.creators=S.creators.filter(x=>x.id!==c.id)})}
function settings(){const o={...S.banner,discordUrl:S.discordUrl,email:S.email,formEndpoint:S.formEndpoint};
 form("Site settings",[{k:"enabled",l:"Show announcement bar",t:"check"},{k:"badge",l:"Badge text",full:false},{k:"code",l:"Coupon code",full:false},{k:"text",l:"Announcement text"},{k:"pct",l:"Discount shown on prices (%)",t:"number",full:false},{k:"endsAt",l:"Offer ends",t:"dt",full:false},{k:"discordUrl",l:"Discord invite link (leave empty to hide)"},{k:"email",l:"Contact email",full:false},{k:"formEndpoint",l:"Commission form endpoint (Formspree)",full:false}],o,v=>{
  S.banner={enabled:!!v.enabled,badge:v.badge,text:v.text,code:v.code,pct:Math.min(90,v.pct),endsAt:v.endsAt};S.discordUrl=v.discordUrl;S.email=v.email;S.formEndpoint=v.formEndpoint})}
/* ===================== OWNER MODE: /#/admin, saves to GitHub ===================== */
const KEY="helix_gh";
const creds=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(_){return null}};
const setCreds=c=>{try{c?localStorage.setItem(KEY,JSON.stringify(c)):localStorage.removeItem(KEY)}catch(_){}};
async function gh(path,opt={}){const c=creds();
 const r=await fetch("https://api.github.com/repos/"+c.repo+path,{...opt,headers:{Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",Authorization:"Bearer "+c.token,...(opt.headers||{})}});
 if(!r.ok){const e=new Error("GitHub "+r.status);e.status=r.status;try{e.detail=(await r.json()).message}catch(_){}throw e}
 return r}
const post=(path,body,method="POST")=>gh(path,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());
function ghError(e){const s=e&&e.status;
 if(s===401)return"GitHub rejected the token. It may be wrong or expired.";
 if(s===403||s===404)return"GitHub can't find that repo, branch or site.json, or the token can't write to it. The token needs Contents: Read and write on this repository.";
 if(s===422)return"The repo changed since you signed in. Reload the page, sign in again and redo your last edit.";
 if(e&&e.message==="Failed to fetch")return"Couldn't reach GitHub. Check your connection.";
 return"Something went wrong"+(e&&e.detail?": "+e.detail:".")}
function login(msg){const d=$("#ed"),c=creds()||{};
 d.innerHTML=`<form><h2 class="full">Owner sign in</h2>
 <p class="mu full" style="font-size:.9rem">Paste a GitHub fine-grained token limited to this repository with <b>Contents: Read and write</b>. It stays in this browser and is never part of the site.</p>
 <div class="fd full"><label>Repository (owner/name)</label><input name="repo" value="${esc(c.repo)}" placeholder="yourname/helix-store" autocomplete="off" required></div>
 <div class="fd full"><label>Branch</label><input name="branch" value="${esc(c.branch||"main")}" autocomplete="off" required></div>
 <div class="fd full"><label>Token</label><input name="token" type="password" value="${esc(c.token)}" autocomplete="off" required></div>
 <div class="cm full" role="status" id="lm" style="color:#fb7185">${esc(msg||"")}</div>
 <div class="row"><span></span><span style="display:flex;gap:8px"><button type="button" class="btn ghost sm" id="ecx">Cancel</button><button class="btn sm" type="submit" id="lg">Sign in</button></span></div></form>`;
 $("#ecx").onclick=()=>d.close();
 d.onclose=()=>{d.innerHTML="";d.onclose=null;if(!OWNER&&/^#\/admin/.test(location.hash))history.replaceState(null,"","#/")};
 $("#ed form").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),b=$("#lg");
  const c={repo:String(f.get("repo")).trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,""),branch:String(f.get("branch")).trim(),token:String(f.get("token")).trim()};
  b.disabled=true;b.textContent="Signing in…";$("#lm").textContent="";
  try{await enter(c);d.close()}catch(err){b.disabled=false;b.textContent="Sign in";$("#lm").textContent=ghError(err)}};
 if(!d.open)d.showModal()}
async function enter(c){setCreds(c);
 try{const r=await gh("/contents/site.json?ref="+encodeURIComponent(c.branch),{headers:{Accept:"application/vnd.github.raw+json"}});S=await r.json()}
 catch(e){setCreds(null);throw e}
 OWNER=true;dirty=0;note="";history.replaceState(null,"","#/");ann();ownBar();route()}
async function admin(){
 if(OWNER){history.replaceState(null,"","#/");route();return}
 if(!creds())return login();
 try{await enter(creds())}catch(e){login(ghError(e))}}

async function publish(){const b=$("#pub");b.disabled=true;b.textContent="Publishing…";const c=creds();
 try{
  const json=JSON.stringify(S,null,2)+"\n",used=new Set(json.match(/images\/[^"\\]+/g)||[]);
  const files=[{path:"site.json",blob:{content:json,encoding:"utf-8"}},...Object.keys(PEND).filter(p=>used.has(p)).map(p=>({path:p,blob:{content:PEND[p].split(",")[1],encoding:"base64"}}))];
  const br=encodeURIComponent(c.branch);
  const ref=await(await gh("/git/ref/heads/"+br)).json(),base=ref.object.sha;
  const cm=await(await gh("/git/commits/"+base)).json();
  const tree=[];for(const f of files){const bl=await post("/git/blobs",f.blob);tree.push({path:f.path,mode:"100644",type:"blob",sha:bl.sha})}
  const nt=await post("/git/trees",{base_tree:cm.tree.sha,tree});
  const nc=await post("/git/commits",{message:"Update site content",tree:nt.sha,parents:[base]});
  await post("/git/refs/heads/"+br,{sha:nc.sha},"PATCH");
  dirty=0;note="Published. The live site updates in about a minute.";ownBar()}
 catch(e){ownBar();alert("Publishing failed. "+ghError(e))}}

function ownBar(){let o=$("#own");if(!o){o=document.createElement("div");o.id="own";o.setAttribute("role","region");o.setAttribute("aria-label","Owner tools");document.body.append(o);$("#ft").style.paddingBottom="90px"}
 o.innerHTML=`<b>Owner mode</b><button class="btn ghost sm" id="set">Site settings</button><span class="mu" style="font-size:.85rem">${dirty?dirty+" unpublished change"+(dirty>1?"s":""):esc(note||"No changes")}</span>${dirty?'<button class="btn sm" id="pub">Publish changes</button><button class="btn ghost sm" id="dis">Discard</button>':""}<button class="btn ghost sm" id="out">Sign out</button>`;
 $("#set").onclick=settings;$("#pub")?.addEventListener("click",publish);$("#dis")?.addEventListener("click",()=>{dirty=0;location.reload()});
 $("#out").onclick=()=>{if(dirty&&!confirm("You have unpublished changes. Sign out and lose them?"))return;dirty=0;setCreds(null);location.reload()}}
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

/* load content, then render */
(async()=>{
 try{const r=await fetch("site.json",{cache:"no-cache"});if(!r.ok)throw 0;S=await r.json()}
 catch(_){app.innerHTML='<div class="wrap"><div class="soon"><h2>The site data didn\'t load</h2><p class="mu">Check your connection and refresh. If you opened this file straight from disk, serve the folder with a local web server instead.</p></div></div>';return}
 ann();route()})();
